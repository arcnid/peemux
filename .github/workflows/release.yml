name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: peemux-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            name: peemux-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: peemux-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz peemux
          cd ../../..
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  update-tap:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_ARM=$(cat peemux-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          SHA_X86=$(cat peemux-x86_64-apple-darwin.tar.gz.sha256 | awk '{print $1}')

          FORMULA=$(cat <<RUBY
          class Peemux < Formula
            desc "The terminal for the agent era — AI coding agent cockpit"
            homepage "https://github.com/arcnid/peemux"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/arcnid/peemux/releases/download/v${VERSION}/peemux-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/arcnid/peemux/releases/download/v${VERSION}/peemux-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86}"
              end
            end

            def install
              bin.install "peemux"
            end

            test do
              assert_match "peemux", shell_output("#{bin}/peemux --version")
            end
          end
          RUBY
          )

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/arcnid/homebrew-peemux.git" tap
          mkdir -p tap/Formula
          echo "$FORMULA" > tap/Formula/peemux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "peemux ${VERSION}" || exit 0
          git push
