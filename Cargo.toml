[package]
name = "peemux"
version = "0.0.1"
edition = "2021"
description = "The terminal for the agent era — AI coding agent cockpit"
license = "MIT"

[[bin]]
name = "peemux"
path = "src/main.rs"

[dependencies]
# TUI rendering + input
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# PTY spawn/io
portable-pty = "0.9"

# VT parsing / screen state — alacritty's terminal-state crate, same engine zellij uses.
# Replaced vt100 0.15 (M1.5) for proper DEC private modes / alt-screen / modern TUIs.
alacritty_terminal = { version = "0.26", default-features = false }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }

# IPC — cross-platform UDS / named pipe
interprocess = { version = "2.2", features = ["tokio"] }

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Wire format
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors + logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Gzip decompression for .dur animation files
flate2 = "1"

# HTTP client for Microsoft Graph API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Misc
directories = "5"
futures = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
